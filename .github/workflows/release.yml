name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make build

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k build/Build/Products/Release/slurper dist/slurper-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: slurper-macos-arm64
          path: dist/slurper-macos-arm64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/slurper-macos-arm64.zip --title "$GITHUB_REF_NAME" --generate-notes
